# main ブランチに入ったコードを Apps Script に自動反映する(clasp push)。
# 事前準備: リポジトリの Settings → Secrets and variables → Actions に
#   CLASPRC_JSON(手元で clasp login したときの ~/.clasprc.json の中身)を登録しておく。
# stock-sheet/db は統合前の旧版なので対象外。
# common/ の共通ファイル(祝日の判定など)は、push の前に両方のプロジェクトへ「共通_<名前>.js」としてコピーする。
name: Apps Script へ反映 (clasp push)

on:
  push:
    branches: [main]
    paths:
      - 'stock-sheet/main/**'
      - 'pl-sheet/**'
      - 'common/**'
  workflow_dispatch: # Actions タブから手動でも実行できる

concurrency:
  group: clasp-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project: [stock-sheet/main, pl-sheet]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: clasp の認証情報を書き出す
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secrets に CLASPRC_JSON が登録されていません"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: 共通ファイルをコピーする(common/*.js → 共通_*.js)
        working-directory: ${{ matrix.project }}
        run: |
          for f in "$GITHUB_WORKSPACE"/common/*.js; do
            cp "$f" "共通_$(basename "$f")"
          done
          ls -1 共通_*.js

      - name: clasp push (${{ matrix.project }})
        working-directory: ${{ matrix.project }}
        run: npx --yes @google/clasp@3 push --force
