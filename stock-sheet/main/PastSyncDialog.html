<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 8px 12px;
        font-size: 12px;
        color: #333;
      }
      #currentMsg {
        color: #188038;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #pastMsg {
        margin-top: 6px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .spinner {
        width: 10px;
        height: 10px;
        border: 2px solid #c6dafc;
        border-top-color: #1a73e8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #note {
        margin-top: 4px;
        color: #888;
        font-size: 11px;
      }
      #errors {
        margin-top: 4px;
        color: #d32f2f;
        font-size: 11px;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="currentMsg"></div>
    <div id="pastMsg"><span class="spinner" id="spinner"></span><span id="pastText">過去分を処理中…</span></div>
    <div id="note">閉じても処理は続きます</div>
    <div id="errors"></div>

    <script>
      // 過去の月次シートを当月に合わせる処理(バックグラウンド)の進み具合を、数秒ごとに読んで表示する。
      // 終わったら数秒後に自動で閉じる。
      const POLL_MS = 4000;
      const CLOSE_AFTER_MS = 4000;

      function show(status) {
        document.getElementById('currentMsg').textContent = status.currentMessage ? '当月: ' + status.currentMessage : '';
        document.getElementById('errors').textContent = (status.errors || []).join('\n');
        const text = document.getElementById('pastText');
        if (status.running) {
          text.textContent = '過去分を処理中… ' + status.done + '/' + status.total + '枚' + (status.current ? '(' + status.current + ')' : '');
          setTimeout(poll, POLL_MS);
          return;
        }
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('note').textContent = '';
        text.textContent = '過去分の処理が終わりました(' + status.total + '枚)';
        setTimeout(function() { google.script.host.close(); }, CLOSE_AFTER_MS);
      }

      function poll() {
        google.script.run
          .withSuccessHandler(show)
          .withFailureHandler(function() { setTimeout(poll, POLL_MS); }) // 一時的な失敗は、次の読み込みで取り直す
          .getPastSheetSyncStatus();
      }

      window.addEventListener('load', poll);
    </script>
  </body>
</html>
