<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        margin: 0;
      }
      #layout {
        display: flex;
        gap: 16px;
      }
      .panel {
        flex: 1;
        min-width: 0;
        height: 548px; /* 左右のリストの下端をそろえる(左は検索窓の分だけリストが短くなる) */
        display: flex;
        flex-direction: column;
      }
      .panel-title {
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .panel-title .sub {
        font-weight: normal;
        font-size: 12px;
        color: #666;
      }
      #searchBox {
        width: 100%;
        padding: 5px 6px;
        box-sizing: border-box;
        font-size: 13px;
        margin-bottom: 6px;
      }
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      .list li {
        padding: 6px 8px;
        border-bottom: 1px solid #eee;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .list li:last-child {
        border-bottom: none;
      }
      #stockList li {
        cursor: pointer;
      }
      #stockList li.checked {
        background: #e8f0fe;
      }
      .industry {
        color: #888;
        font-size: 11px;
        margin-left: auto;
        white-space: nowrap;
      }
      .remove-btn {
        margin-left: auto;
        border: none;
        background: none;
        color: #d32f2f;
        font-size: 16px;
        cursor: pointer;
        padding: 0 4px;
        line-height: 1;
      }
      .empty {
        color: #999;
        font-size: 12px;
        padding: 12px 8px;
        text-align: center;
      }
      .buttons {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #statusMsg {
        font-size: 12px;
        flex-grow: 1;
      }
      button.main {
        padding: 6px 16px;
        font-size: 13px;
        white-space: nowrap;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="layout">
      <div class="panel">
        <div class="panel-title">登録銘柄 <span class="sub">チェックで右のリストに追加</span></div>
        <input type="text" id="searchBox" placeholder="銘柄コードまたは銘柄名で絞り込み">
        <ul id="stockList" class="list"><li class="empty">読み込み中…</li></ul>
      </div>
      <div class="panel">
        <div class="panel-title">決算情報を取得する銘柄 <span class="sub" id="selectedCount"></span></div>
        <ul id="selectedList" class="list"></ul>
      </div>
    </div>

    <div class="buttons">
      <div id="statusMsg"></div>
      <button class="main" id="cancelBtn" onclick="google.script.host.close()">キャンセル</button>
      <button class="main" id="updateBtn" onclick="saveTargets()" disabled>更新</button>
    </div>

    <script>
      let stocks = [];        // 登録銘柄 [{code, name, industry}](当月シートの並び順)
      let selectedCodes = []; // 右のリストに入っている銘柄コード(追加した順)

      window.addEventListener('load', function() {
        google.script.run
          .withSuccessHandler(function(data) {
            stocks = data.stocks;
            const known = {};
            stocks.forEach(function(s) { known[s.code] = true; });
            // 株式情報から削除された銘柄は、選択に残さない(更新するとシートからも消える)
            selectedCodes = data.selected.filter(function(code) { return known[code]; });
            const dropped = data.selected.length - selectedCodes.length;
            if (dropped > 0) setStatus('株式情報に無くなった銘柄 ' + dropped + '件は、リストから外しました(更新するとシートからも消えます)', '#e37400');
            document.getElementById('updateBtn').disabled = false;
            render();
          })
          .withFailureHandler(function(err) {
            document.getElementById('stockList').innerHTML = '';
            setStatus('読み込みに失敗しました: ' + err.message, '#d32f2f');
          })
          .getKessanTargetDialogData();
      });

      document.getElementById('searchBox').addEventListener('input', renderStockList);

      function setStatus(text, color) {
        const el = document.getElementById('statusMsg');
        el.style.color = color || '#333';
        el.textContent = text;
      }

      function stockByCode(code) {
        return stocks.find(function(s) { return s.code === code; });
      }

      function toggle(code) {
        const i = selectedCodes.indexOf(code);
        if (i === -1) selectedCodes.push(code);
        else selectedCodes.splice(i, 1);
        render();
      }

      function render() {
        renderStockList();
        renderSelectedList();
      }

      /** 左: 登録銘柄(検索窓の文字で、コードの先頭一致・銘柄名の部分一致で絞り込む) */
      function renderStockList() {
        const list = document.getElementById('stockList');
        const scrollTop = list.scrollTop;
        const q = document.getElementById('searchBox').value.trim().toUpperCase();
        const shown = stocks.filter(function(s) {
          return !q || s.code.indexOf(q) === 0 || s.name.toUpperCase().indexOf(q) !== -1;
        });
        list.innerHTML = '';
        if (shown.length === 0) {
          list.innerHTML = '<li class="empty">' + (stocks.length === 0 ? '登録銘柄がありません' : '見つかりません') + '</li>';
          return;
        }
        shown.forEach(function(s) {
          const li = document.createElement('li');
          const checked = selectedCodes.indexOf(s.code) !== -1;
          if (checked) li.className = 'checked';
          const box = document.createElement('input');
          box.type = 'checkbox';
          box.checked = checked;
          box.addEventListener('click', function(e) { e.stopPropagation(); toggle(s.code); });
          li.appendChild(box);
          li.appendChild(document.createTextNode(s.code + '(' + s.name + ')'));
          const ind = document.createElement('span');
          ind.className = 'industry';
          ind.textContent = s.industry;
          li.appendChild(ind);
          li.addEventListener('click', function() { toggle(s.code); }); // 行のどこを押しても切り替える
          list.appendChild(li);
        });
        list.scrollTop = scrollTop;
      }

      /** 右: 決算情報を取得する銘柄(×でリストから削除) */
      function renderSelectedList() {
        const list = document.getElementById('selectedList');
        document.getElementById('selectedCount').textContent = selectedCodes.length + '銘柄';
        list.innerHTML = '';
        if (selectedCodes.length === 0) {
          list.innerHTML = '<li class="empty">左の一覧でチェックした銘柄がここに並びます</li>';
          return;
        }
        selectedCodes.forEach(function(code) {
          const s = stockByCode(code) || { code: code, name: '', industry: '' };
          const li = document.createElement('li');
          li.appendChild(document.createTextNode(s.code + '(' + s.name + ')'));
          const btn = document.createElement('button');
          btn.className = 'remove-btn';
          btn.title = 'リストから削除';
          btn.textContent = '×';
          btn.addEventListener('click', function() { toggle(code); });
          li.appendChild(btn);
          list.appendChild(li);
        });
      }

      /** 「更新」: 右のリストの銘柄で、別ファイル「決算情報」の「決算情報取得銘柄」シートを書き直す */
      function saveTargets() {
        const btn = document.getElementById('updateBtn');
        btn.disabled = true;
        setStatus('更新中…');
        const targets = selectedCodes.map(function(code) {
          const s = stockByCode(code) || { code: code, name: '', industry: '' };
          return { code: s.code, name: s.name, industry: s.industry };
        });
        google.script.run
          .withSuccessHandler(function(result) {
            btn.disabled = false;
            const el = document.getElementById('statusMsg');
            el.style.color = '#188038';
            el.textContent = result.message + ' ';
            const a = document.createElement('a');
            a.href = result.url;
            a.target = '_blank';
            a.textContent = 'ファイルを開く';
            el.appendChild(a);
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            setStatus('更新に失敗しました: ' + err.message, '#d32f2f');
          })
          .saveKessanTargets(targets);
      }
    </script>
  </body>
</html>
