<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        width: 300px;
      }
      #hint {
        font-size: 12px;
        color: #666;
        margin-bottom: 10px;
      }
      #sortList {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 640px;
        overflow-y: auto;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      #sortList li {
        padding: 8px 10px;
        border-bottom: 1px solid #eee;
        cursor: grab;
        background: #fff;
        font-size: 13px;
        display: flex;
        align-items: center;
      }
      #sortList li:last-child {
        border-bottom: none;
      }
      #sortList li.dragging {
        opacity: 0.4;
      }
      #sortList li.drag-over {
        border-top: 2px solid #4285f4;
      }
      .drag-handle {
        margin-right: 8px;
        color: #999;
      }
      .buttons {
        margin-top: 16px;
        text-align: right;
      }
      button {
        padding: 6px 16px;
        font-size: 13px;
        margin-left: 8px;
      }
      #statusMsg {
        font-size: 12px;
        margin-top: 8px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="hint">ドラッグして順番を並び替えてください</div>
    <ul id="sortList"></ul>

    <div id="statusMsg"></div>

    <div class="buttons">
      <button id="closeBtn" onclick="google.script.host.close()">閉じる</button>
      <button id="applyBtn" onclick="applyOrder()">この順番で適用</button>
    </div>

    <script>
      let draggingEl = null;

      // ==== ドラッグ中の自動スクロール ====
      // ブラウザ標準の自動スクロールはリストの端のごく狭い範囲でしか反応しないため、自前で行う。
      // リストの上端・下端から AUTO_SCROLL_ZONE px 以内にカーソルがあると、端に近いほど速くスクロールする。
      // リストの外(上の説明文や下のボタンのあたり)まで出たときは最高速でスクロールする。
      // 同じ向きにスクロールし続けると、AUTO_SCROLL_BOOST_MS かけて最大 AUTO_SCROLL_BOOST_MAX 倍まで加速する
      // (少しだけ動かしたいときはゆっくり、遠くまで運ぶときは速くなる)。
      const AUTO_SCROLL_ZONE = 90;        // 反応する範囲(px)
      const AUTO_SCROLL_MAX_SPEED = 32;   // 1フレームあたりの最大スクロール量(px、加速前)
      const AUTO_SCROLL_BOOST_MAX = 2;    // 押し当て続けたときの最大倍率
      const AUTO_SCROLL_BOOST_MS = 800;   // 最大倍率に達するまでの時間(ミリ秒)
      let dragPointerY = null;
      let autoScrollFrame = null;
      let scrollingSince = null; // 今の向きでスクロールし始めた時刻(止まったら null)
      let scrollingDir = 0;

      function autoScrollStep() {
        const list = document.getElementById('sortList');
        if (dragPointerY !== null) {
          const rect = list.getBoundingClientRect();
          let speed = 0; // -1(上へ最高速)〜1(下へ最高速)
          if (dragPointerY < rect.top + AUTO_SCROLL_ZONE) {
            speed = -Math.min(1, (rect.top + AUTO_SCROLL_ZONE - dragPointerY) / AUTO_SCROLL_ZONE);
          } else if (dragPointerY > rect.bottom - AUTO_SCROLL_ZONE) {
            speed = Math.min(1, (dragPointerY - (rect.bottom - AUTO_SCROLL_ZONE)) / AUTO_SCROLL_ZONE);
          }
          const dir = Math.sign(speed);
          if (dir === 0 || dir !== scrollingDir) {
            scrollingSince = dir === 0 ? null : performance.now();
            scrollingDir = dir;
          }
          if (dir !== 0) {
            const held = Math.min(1, (performance.now() - scrollingSince) / AUTO_SCROLL_BOOST_MS);
            const boost = 1 + (AUTO_SCROLL_BOOST_MAX - 1) * held;
            list.scrollTop += Math.round(speed * AUTO_SCROLL_MAX_SPEED * boost) || dir;
          }
        }
        autoScrollFrame = requestAnimationFrame(autoScrollStep);
      }

      function startAutoScroll() {
        if (autoScrollFrame === null) autoScrollFrame = requestAnimationFrame(autoScrollStep);
      }

      function stopAutoScroll() {
        if (autoScrollFrame !== null) cancelAnimationFrame(autoScrollFrame);
        autoScrollFrame = null;
        dragPointerY = null;
        scrollingSince = null;
        scrollingDir = 0;
      }

      // dragoverはカーソルの下の要素から伝わってくるので、リストの外にいるときの位置もここで拾える
      document.addEventListener('dragover', function(e) {
        if (draggingEl) dragPointerY = e.clientY;
      });

      window.addEventListener('load', function() {
        google.script.run
          .withSuccessHandler(renderList)
          .withFailureHandler(function(err) {
            document.getElementById('hint').textContent = '読み込みに失敗しました: ' + err.message;
          })
          .getCurrentStockOrder();
      });

      function renderList(items) {
        const list = document.getElementById('sortList');
        list.innerHTML = '';

        items.forEach(function(item) {
          const li = document.createElement('li');
          li.draggable = true;
          li.dataset.code = item.code;
          li.innerHTML = '<span class="drag-handle">≡</span>' + item.code + '(' + item.name + ')';

          li.addEventListener('dragstart', function() {
            draggingEl = li;
            li.classList.add('dragging');
            startAutoScroll();
          });

          li.addEventListener('dragend', function() {
            li.classList.remove('dragging');
            draggingEl = null;
            stopAutoScroll();
            Array.from(list.children).forEach(function(el) {
              el.classList.remove('drag-over');
            });
          });

          li.addEventListener('dragover', function(e) {
            e.preventDefault();
            if (li !== draggingEl) {
              li.classList.add('drag-over');
            }
          });

          li.addEventListener('dragleave', function() {
            li.classList.remove('drag-over');
          });

          li.addEventListener('drop', function(e) {
            e.preventDefault();
            li.classList.remove('drag-over');
            if (draggingEl && draggingEl !== li) {
              const rect = li.getBoundingClientRect();
              const insertAfter = (e.clientY - rect.top) > rect.height / 2;
              if (insertAfter) {
                li.after(draggingEl);
              } else {
                li.before(draggingEl);
              }
            }
          });

          list.appendChild(li);
        });
      }

      function applyOrder() {
        const items = document.querySelectorAll('#sortList li');
        const orderedCodes = Array.from(items).map(function(li) {
          return li.dataset.code;
        });

        const statusMsg = document.getElementById('statusMsg');
        const applyBtn = document.getElementById('applyBtn');
        applyBtn.disabled = true;
        statusMsg.style.display = 'block';
        statusMsg.style.color = '#333';
        statusMsg.textContent = '適用中...';

        google.script.run
          .withSuccessHandler(function(message) {
            statusMsg.style.color = '#34a853';
            statusMsg.textContent = message;
            applyBtn.disabled = false;
          })
          .withFailureHandler(function(err) {
            statusMsg.style.color = '#d32f2f';
            statusMsg.textContent = 'エラー: ' + err.message;
            applyBtn.disabled = false;
          })
          .reorderBothSheets(orderedCodes);
      }
    </script>
  </body>
</html>
