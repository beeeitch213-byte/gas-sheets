<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        width: 600px;
      }
      #layout {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      #listArea {
        width: 300px;
        flex-shrink: 0;
      }
      #searchArea {
        flex-grow: 1;
        padding-top: 26px;
      }
      #searchArea label {
        display: block;
        font-size: 13px;
        margin-bottom: 4px;
      }
      #searchBox {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
        font-size: 14px;
      }
      #searchMsg {
        font-size: 12px;
        color: #666;
        margin-top: 6px;
        min-height: 16px;
      }
      #searchHelp {
        font-size: 11px;
        color: #999;
        margin-top: 10px;
        line-height: 1.5;
      }
      #sortList li.search-hit {
        background: #ffe066;
        box-shadow: inset 4px 0 0 #f4b400; /* 左端の目印 */
        font-weight: bold;
      }
      #hint {
        font-size: 12px;
        color: #666;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #reloadBtn {
        padding: 2px 8px;
        font-size: 11px;
        margin-left: 0;
      }
      #sortList {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 640px;
        overflow-y: auto;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      #sortList li {
        padding: 8px 10px;
        border-bottom: 1px solid #eee;
        cursor: grab;
        background: #fff;
        font-size: 13px;
        display: flex;
        align-items: center;
      }
      #sortList li:last-child {
        border-bottom: none;
      }
      #sortList li.dragging {
        opacity: 0.4;
      }
      #sortList li.drag-over {
        border-top: 2px solid #4285f4;
      }
      .drag-handle {
        margin-right: 8px;
        color: #999;
      }
      .buttons {
        margin-top: 16px;
        text-align: right;
      }
      button {
        padding: 6px 16px;
        font-size: 13px;
        margin-left: 8px;
      }
      #statusMsg {
        font-size: 12px;
        margin-top: 8px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="listArea">
        <div id="hint">
          <span id="hintText">ドラッグして順番を並び替えてください</span>
          <button id="reloadBtn" onclick="reloadList()" title="銘柄追加で増えた銘柄をリストに反映します">再読み込み</button>
        </div>
        <ul id="sortList"></ul>
      </div>
      <div id="searchArea">
        <label for="searchBox">銘柄を探す</label>
        <input type="text" id="searchBox" placeholder="銘柄コード(例: 7203)または銘柄名">
        <div id="searchMsg"></div>
        <div id="searchHelp">
          入力するとその銘柄までスクロールして黄色で示します。<br>
          銘柄コードは先頭から一致、銘柄名は一部が一致すれば見つかります。<br>
          複数見つかったときは Enter で次の候補に移ります。
        </div>
      </div>
    </div>

    <div id="statusMsg"></div>

    <div class="buttons">
      <button id="closeBtn" onclick="google.script.host.close()">閉じる</button>
      <button id="applyBtn" onclick="applyOrder()">この順番で適用</button>
    </div>

    <script>
      let draggingEl = null;

      // ==== ドラッグ中の自動スクロール ====
      // ブラウザ標準の自動スクロールはリストの端のごく狭い範囲でしか反応しないため、自前で行う。
      // リストの上端・下端から AUTO_SCROLL_ZONE px 以内にカーソルがあると、端に近いほど速くスクロールする。
      // リストの外(上の説明文や下のボタンのあたり)まで出たときは最高速でスクロールする。
      // 同じ向きにスクロールし続けると、AUTO_SCROLL_BOOST_MS かけて最大 AUTO_SCROLL_BOOST_MAX 倍まで加速する
      // (少しだけ動かしたいときはゆっくり、遠くまで運ぶときは速くなる)。
      const AUTO_SCROLL_ZONE = 90;        // 反応する範囲(px)
      const AUTO_SCROLL_MAX_SPEED = 32;   // 1フレームあたりの最大スクロール量(px、加速前)
      const AUTO_SCROLL_BOOST_MAX = 2;    // 押し当て続けたときの最大倍率
      const AUTO_SCROLL_BOOST_MS = 800;   // 最大倍率に達するまでの時間(ミリ秒)
      let dragPointerY = null;
      let autoScrollFrame = null;
      let scrollingSince = null; // 今の向きでスクロールし始めた時刻(止まったら null)
      let scrollingDir = 0;

      function autoScrollStep() {
        const list = document.getElementById('sortList');
        if (dragPointerY !== null) {
          const rect = list.getBoundingClientRect();
          let speed = 0; // -1(上へ最高速)〜1(下へ最高速)
          if (dragPointerY < rect.top + AUTO_SCROLL_ZONE) {
            speed = -Math.min(1, (rect.top + AUTO_SCROLL_ZONE - dragPointerY) / AUTO_SCROLL_ZONE);
          } else if (dragPointerY > rect.bottom - AUTO_SCROLL_ZONE) {
            speed = Math.min(1, (dragPointerY - (rect.bottom - AUTO_SCROLL_ZONE)) / AUTO_SCROLL_ZONE);
          }
          const dir = Math.sign(speed);
          if (dir === 0 || dir !== scrollingDir) {
            scrollingSince = dir === 0 ? null : performance.now();
            scrollingDir = dir;
          }
          if (dir !== 0) {
            const held = Math.min(1, (performance.now() - scrollingSince) / AUTO_SCROLL_BOOST_MS);
            const boost = 1 + (AUTO_SCROLL_BOOST_MAX - 1) * held;
            list.scrollTop += Math.round(speed * AUTO_SCROLL_MAX_SPEED * boost) || dir;
          }
        }
        autoScrollFrame = requestAnimationFrame(autoScrollStep);
      }

      function startAutoScroll() {
        if (autoScrollFrame === null) autoScrollFrame = requestAnimationFrame(autoScrollStep);
      }

      function stopAutoScroll() {
        if (autoScrollFrame !== null) cancelAnimationFrame(autoScrollFrame);
        autoScrollFrame = null;
        dragPointerY = null;
        scrollingSince = null;
        scrollingDir = 0;
      }

      // dragoverはカーソルの下の要素から伝わってくるので、リストの外にいるときの位置もここで拾える
      document.addEventListener('dragover', function(e) {
        if (draggingEl) dragPointerY = e.clientY;
      });

      window.addEventListener('load', function() {
        google.script.run
          .withSuccessHandler(renderList)
          .withFailureHandler(function(err) {
            document.getElementById('hintText').textContent = '読み込みに失敗しました: ' + err.message;
          })
          .getCurrentStockOrder();
      });

      function renderList(items) {
        const list = document.getElementById('sortList');
        list.innerHTML = '';

        items.forEach(function(item) {
          const li = document.createElement('li');
          li.draggable = true;
          li.dataset.code = item.code;
          li.dataset.name = item.name;
          li.innerHTML = '<span class="drag-handle">≡</span>' + item.code + '(' + item.name + ')';

          li.addEventListener('dragstart', function() {
            draggingEl = li;
            li.classList.add('dragging');
            startAutoScroll();
          });

          li.addEventListener('dragend', function() {
            li.classList.remove('dragging');
            draggingEl = null;
            stopAutoScroll();
            Array.from(list.children).forEach(function(el) {
              el.classList.remove('drag-over');
            });
          });

          li.addEventListener('dragover', function(e) {
            e.preventDefault();
            if (li !== draggingEl) {
              li.classList.add('drag-over');
            }
          });

          li.addEventListener('dragleave', function() {
            li.classList.remove('drag-over');
          });

          li.addEventListener('drop', function(e) {
            e.preventDefault();
            li.classList.remove('drag-over');
            if (draggingEl && draggingEl !== li) {
              const rect = li.getBoundingClientRect();
              const insertAfter = (e.clientY - rect.top) > rect.height / 2;
              if (insertAfter) {
                li.after(draggingEl);
              } else {
                li.before(draggingEl);
              }
            }
          });

          list.appendChild(li);
        });
      }

      // ==== 銘柄の検索(右側の検索窓) ====
      // 入力のたびに、銘柄コードの前方一致・銘柄名の部分一致で探し、見つかった銘柄をリストの中央までスクロールして示す。
      // 複数見つかったときは Enter で次の候補に移る(並び替えた後でも、今の並び順で探す)。
      let searchHits = [];
      let searchIndex = 0;

      function findStocks(query) {
        const q = query.trim().toUpperCase();
        if (!q) return [];
        const items = Array.from(document.querySelectorAll('#sortList li'));
        const byCode = items.filter(function(li) { return li.dataset.code.toUpperCase().indexOf(q) === 0; });
        const byName = items.filter(function(li) {
          return byCode.indexOf(li) === -1 && String(li.dataset.name).toUpperCase().indexOf(q) !== -1;
        });
        return byCode.concat(byName); // コードで当たったものを先に
      }

      function showSearchHit() {
        document.querySelectorAll('#sortList li.search-hit').forEach(function(el) { el.classList.remove('search-hit'); });
        const msg = document.getElementById('searchMsg');
        if (searchHits.length === 0) {
          msg.textContent = document.getElementById('searchBox').value.trim() ? '見つかりません' : '';
          return;
        }
        const li = searchHits[searchIndex];
        li.classList.add('search-hit');
        const list = document.getElementById('sortList');
        list.scrollTop = li.offsetTop - list.offsetTop - (list.clientHeight - li.offsetHeight) / 2;
        msg.textContent = li.dataset.code + '(' + li.dataset.name + ')' +
          (searchHits.length > 1 ? '  ' + (searchIndex + 1) + '/' + searchHits.length + '件' : '');
      }

      document.getElementById('searchBox').addEventListener('input', function() {
        searchHits = findStocks(this.value);
        searchIndex = 0;
        showSearchHit();
      });

      document.getElementById('searchBox').addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (searchHits.length === 0) return;
        searchIndex = (searchIndex + 1) % searchHits.length;
        showSearchHit();
      });

      /**
       * 「再読み込み」: 当月シートの最新の銘柄一覧を読み直す(サイドバーの銘柄追加で増えた銘柄を反映する)。
       * ここまでに並べ替えた順番は残し、新しく増えた銘柄は末尾に足す。シートから消えた銘柄はリストからも消す。
       */
      // quiet: trueなら、銘柄の増減が無かったときは何も表示しない(ダイアログに戻ったときの自動読み直し用)
      function reloadList(quiet) {
        const btn = document.getElementById('reloadBtn');
        const statusMsg = document.getElementById('statusMsg');
        btn.disabled = true;
        google.script.run
          .withSuccessHandler(function(items) {
            btn.disabled = false;
            const current = Array.from(document.querySelectorAll('#sortList li')).map(function(li) { return li.dataset.code; });
            const byCode = {};
            items.forEach(function(item) { byCode[item.code] = item; });
            const kept = current.filter(function(code) { return byCode[code]; }).map(function(code) { return byCode[code]; });
            const added = items.filter(function(item) { return current.indexOf(item.code) === -1; });
            const removedCount = current.length - kept.length;
            const scrollTop = document.getElementById('sortList').scrollTop;
            renderList(kept.concat(added));
            document.getElementById('sortList').scrollTop = scrollTop;
            // 検索結果は古いリストの要素を指しているので、今の入力で探し直す
            searchHits = findStocks(document.getElementById('searchBox').value);
            searchIndex = 0;
            if (searchHits.length > 0) showSearchHit();
            if (quiet === true && added.length === 0 && removedCount === 0) return;
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#333';
            statusMsg.textContent = '銘柄一覧を読み込みました' +
              (added.length > 0 ? '(追加: ' + added.map(function(i) { return i.code; }).join(', ') + ')' : '') +
              (removedCount > 0 ? '(削除: ' + removedCount + '件)' : '') +
              (added.length === 0 && removedCount === 0 ? '(変更なし)' : '');
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            if (quiet === true) return;
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#d32f2f';
            statusMsg.textContent = '読み込みに失敗しました: ' + err.message;
          })
          .getCurrentStockOrder();
      }

      // サイドバーの銘柄追加から並び替えダイアログに戻ってきた(クリックした)ときに、銘柄一覧を自動で読み直す。
      // ドラッグ中・適用中・直前に読み直したばかりのときは読み直さない。
      const AUTO_RELOAD_INTERVAL_MS = 3000;
      let lastAutoReload = 0;
      window.addEventListener('focus', function() {
        if (draggingEl || document.getElementById('applyBtn').disabled || document.getElementById('reloadBtn').disabled) return;
        if (!document.querySelector('#sortList li')) return; // 初回の読み込み前
        if (Date.now() - lastAutoReload < AUTO_RELOAD_INTERVAL_MS) return;
        lastAutoReload = Date.now();
        reloadList(true);
      });

      function applyOrder() {
        const items = document.querySelectorAll('#sortList li');
        const orderedCodes = Array.from(items).map(function(li) {
          return li.dataset.code;
        });

        const statusMsg = document.getElementById('statusMsg');
        const applyBtn = document.getElementById('applyBtn');
        applyBtn.disabled = true;
        statusMsg.style.display = 'block';
        statusMsg.style.color = '#333';
        statusMsg.textContent = '適用中...';

        google.script.run
          .withSuccessHandler(function(message) {
            statusMsg.style.color = '#34a853';
            statusMsg.textContent = message;
            applyBtn.disabled = false;
          })
          .withFailureHandler(function(err) {
            statusMsg.style.color = '#d32f2f';
            statusMsg.textContent = 'エラー: ' + err.message;
            applyBtn.disabled = false;
          })
          .reorderBothSheets(orderedCodes);
      }
    </script>
  </body>
</html>
